name: Agent Task Webhook & Dispatcher

on:
  issues:
    types: [opened, labeled, assigned]

jobs:
  agent-trigger:
    if: contains(github.event.issue.labels.*.name, 'agent:ready') || github.event.action == 'assigned'
    runs-on: ubuntu-latest
    steps:
      - name: Log Issue Event
        run: |
          echo "Task detected: #${{ github.event.issue.number }} - ${{ github.event.issue.title }}"
          echo "Triggered by action: ${{ github.event.action }}"

      - name: Dispatch to Agent Manager Webhook (Optional)
        if: env.AGENT_MANAGER_URL != ''
        env:
          AGENT_MANAGER_URL: ${{ secrets.AGENT_MANAGER_URL }}
          AGENT_WEBHOOK_SECRET: ${{ secrets.AGENT_WEBHOOK_SECRET }}
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -H "X-GitHub-Event: issues" \
            -d '{
              "action": "${{ github.event.action }}",
              "issue": {
                "number": ${{ github.event.issue.number }},
                "title": "${{ github.event.issue.title }}",
                "body": "${{ github.event.issue.body }}",
                "labels": ${{ toJson(github.event.issue.labels) }}
              },
              "repository": {
                "full_name": "${{ github.repository }}"
              }
            }' \
            "$AGENT_MANAGER_URL"

      - name: Add Acknowledgment Comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 **Agent Task Registered**\n\nThis task is queued for autonomous agent development. Once work is complete, a pull request will be opened linking to this issue with test verification and video/screenshot recordings.'
            })
